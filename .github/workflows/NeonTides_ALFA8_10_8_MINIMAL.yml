name: Build Neon Tides alfa8.10.9 context assembler

on:
  push:
    branches:
      - alfa8.10.9-context-assembler
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gguf-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply stable minimal base
        run: python3 scripts/apply_alfa8_10_8_minimal.py
      - name: Apply contextual assembler
        run: python3 scripts/apply_alfa8_10_9_context_assembler.py
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Verify assembler
        shell: bash
        run: |
          set -euo pipefail
          AI="app/src/main/java/com/neontides/nativeapp/ai/AiEngine.kt"
          grep -F 'versionCode = 46' app/build.gradle.kts
          grep -F 'versionName = "alfa8.10.9-context-assembler"' app/build.gradle.kts
          grep -F 'private fun contextualDisposition' "$AI"
          grep -F 'val disposition = contextualDisposition(character, relationship)' "$AI"
          grep -F 'simpleTurn -> 420' "$AI"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/NeonTides-alfa8.10.9-context-assembler.apk
          ls -lh out/NeonTides-alfa8.10.9-context-assembler.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonTides-alfa8.10.9-context-assembler
          path: out/NeonTides-alfa8.10.9-context-assembler.apk
          if-no-files-found: error
          retention-days: 14
