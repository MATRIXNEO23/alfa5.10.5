name: Neon Tides alfa8.10.8 Luna compile check

on:
  workflow_dispatch:
  push:
    branches: [ "alfa8.10.8-luna-test" ]
    paths:
      - "app/**"
      - "mlc4j-stub/**"
      - "settings.gradle.kts"
      - ".github/workflows/NeonTides_8108_LUNA_COMPILE_CHECK.yml"

permissions:
  contents: read

jobs:
  compile-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout 8.10.8 Luna branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Verify requested version
        shell: bash
        run: |
          grep -F 'versionCode = 45' app/build.gradle.kts
          grep -F 'versionName = "alfa8.10.8-luna-test"' app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile and run unit tests with MLC stub
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare test artifact
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NeonTides-alfa8.10.8-luna-compile-check.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeonTides-alfa8.10.8-luna-compile-check
          path: out/NeonTides-alfa8.10.8-luna-compile-check.apk
          retention-days: 14
