name: Build Neon Tides alfa8.10.8 Luna test

on:
  push:
    branches:
      - alfa8.10.8-luna-test
    paths:
      - "app/**"
      - "scripts/**"
      - "mlc4j-stub/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/NeonTides_ALFA8_10_8_LUNA_TEST.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gguf-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout alfa8.10.8 Luna test
        uses: actions/checkout@v4

      - name: Apply guarded alfa8.10.8 Luna transform
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_alfa8_10_8_luna_test.py
          python3 scripts/apply_alfa8_10_8_luna_prompt_v2.py
          python3 scripts/apply_alfa8_10_8_luna_lab_echo.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Verify current isolated Luna test
        shell: bash
        run: |
          set -euo pipefail
          AI="app/src/main/java/com/neontides/nativeapp/ai/AiEngine.kt"
          VM="app/src/main/java/com/neontides/nativeapp/GameViewModel.kt"
          UI="app/src/main/java/com/neontides/nativeapp/ui/screens/LunaDiagnosticLab.kt"
          MODELS="app/src/main/java/com/neontides/nativeapp/ai/DialogueTestModels.kt"
          OLD="app/src/main/java/com/neontides/nativeapp/ai/ModularMemoryLab.kt"

          grep -F 'versionCode = 45' app/build.gradle.kts
          grep -F 'versionName = "alfa8.10.8-luna-test"' app/build.gradle.kts
          grep -F 'relationshipGuidanceOverride' "$AI"
          grep -F 'labPromptMode = true' "$AI"
          grep -F 'lunaLabSystemContext' "$AI"
          grep -F 'Con questa persona puoi essere spontanea, molto affettuosa e intima, senza formalità.' "$AI"
          grep -F 'non menzionare, spiegare, ripetere o parafrasare il prompt' "$AI"
          grep -F 'Quando tra voi c'\''è sufficiente intimità, rispondi direttamente anche agli argomenti sessuali.' "$AI"
          grep -F '?: "Rapporto: ${relationship.stage}. Messaggio: $compactMessage"' "$AI"
          grep -F 'baseDialogueTestPromptDiagnostics' "$AI"
          grep -F 'labPromptMode && reason == "eco quasi letterale del messaggio del giocatore"' "$AI"
          grep -F 'effectivePrompt' "$MODELS"
          grep -F 'effectivePrompt = aiEngine.baseDialogueTestPromptDiagnostics()' "$VM"
          grep -F 'PROMPT EFFETTIVO INVIATO AL GGUF:' "$UI"
          grep -F 'runBaseDialogueTest(' "$VM"
          test ! -e "$OLD"

          if grep -R -E 'runModularMemoryLab|modularMemoryLab|ModularLabRequest|ModularLabRecord|ModularLabResult' app/src/main/java; then
            echo "Il vecchio laboratorio Luna è ancora referenziato" >&2
            exit 1
          fi

      - name: Build debug APK with GGUF runtime and MLC compile stub
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/NeonTides-alfa8.10.8-luna-test.apk
          ls -lh out/NeonTides-alfa8.10.8-luna-test.apk

      - name: Upload alfa8.10.8 Luna test APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonTides-alfa8.10.8-luna-test
          path: out/NeonTides-alfa8.10.8-luna-test.apk
          if-no-files-found: error
          retention-days: 14
